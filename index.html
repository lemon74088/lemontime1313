<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="倒數面板">
<title>倒數計時面板｜修正版</title>
<style>
:root{color-scheme:dark;--bg:#101114;--card:#202126;--muted:#8c8e98;--white:#f4f5f7;--green:#25c46a;--yellow:#f3c847;--orange:#ff913d;--red:#ff4c58}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px 14px calc(18px + env(safe-area-inset-bottom));}
header{display:flex;align-items:center;justify-content:space-between;margin:5px 2px 13px}h1{font-size:17px;margin:0;letter-spacing:.08em;font-weight:700}.sub{font-size:11px;color:var(--muted);margin-top:4px}.tools{display:flex;gap:7px}
.smallbtn{border:1px solid #34353b;background:#24252b;color:#d8d9de;border-radius:10px;padding:7px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid #2b2c32;border-radius:16px;padding:15px 11px 12px;min-width:0;min-height:145px;transition:background .2s,border-color .2s;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
.tile.running{border-color:#44454c}.tile.greenAlert{background:#203329;border-color:#328553}.tile.warning{background:#332f20;border-color:#88722e}.tile.urgent{background:#38291e;border-color:#9c5b30}.tile.critical{background:#3a2226;border-color:#a63c47}.tile.done{opacity:.6}
.top{display:flex;justify-content:space-between;align-items:center;gap:5px}.label{font-size:13px;font-weight:700;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:#72737b;flex:0 0 auto}.running .dot{background:var(--green)}.warning .dot{background:var(--yellow)}.urgent .dot{background:var(--orange)}.critical .dot{background:var(--red)}
.time{font-variant-numeric:tabular-nums;font-weight:800;font-size:clamp(19px,5.5vw,25px);letter-spacing:-.03em;white-space:nowrap;margin:9px 0 3px}.localfinish{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:14px;margin-bottom:7px}.greenAlert .time{color:var(--green)}.warning .time{color:var(--yellow)}.urgent .time{color:var(--orange)}.critical .time{color:var(--red)}
.actions{display:flex;justify-content:flex-end}.cancel{font-size:12px;padding:8px 12px;border-radius:9px;border:0;background:#383940;color:#bfc0c6;min-height:36px;min-width:64px}.cancel:disabled{opacity:.22}.cancel.startBtn{background:var(--green);color:#07170d;font-weight:800}.cancel.startBtn:active{opacity:.78}
.mainbtn{width:100%;border:0;background:var(--green);color:#07170d;font-weight:800;border-radius:13px;padding:13px 12px;font-size:15px;margin-top:12px}.mainbtn:active{opacity:.8}.maincontrols{margin:0 0 12px}.maincontrols .mainbtn{margin-top:0}.maincontrols #stopAllBtn{margin-top:7px!important}
.footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;margin-top:10px}
.editing .tile{outline:1px dashed #777;cursor:grab}.tile.dragging{opacity:.35}.tile.dragover{outline:2px solid var(--green)}
.modal{position:fixed;inset:0;z-index:9999;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{width:min(360px,100%);background:#222329;border:1px solid #393a40;border-radius:18px;padding:18px}.dialog h2{font-size:16px;margin:0 0 14px}.dialog label{display:block;font-size:12px;color:#b4b5bc;margin:10px 0 5px}.dialog input{width:100%;background:#111216;border:1px solid #404149;color:white;border-radius:9px;padding:10px;font-size:16px}.dialogbuttons{display:flex;gap:8px;margin-top:15px}.dialogbuttons button{flex:1;border-radius:10px;padding:10px;border:0}.save{background:var(--green);color:#07170d;font-weight:700}.close{background:#3a3b42;color:white}
@media(min-width:520px){body{max-width:520px;margin:0 auto}.grid{gap:10px}.tile{padding:13px}}
</style>
</head>
<body>
<header><div><h1>倒數計時面板</h1><div class="sub">多週期同步 · 手動排序</div></div><div class="tools"><button class="smallbtn" id="resetBtn">恢復預設</button><button class="smallbtn" id="addBtn">＋自訂</button></div></header>
<div class="maincontrols"><button class="mainbtn" id="startBtn">一鍵啟動全部</button><button class="mainbtn" id="stopAllBtn" style="background:#383940;color:#f4f5f7;margin-top:7px">一鍵全部停止</button></div>
<div class="grid" id="grid"></div>
<div style="display:flex;gap:8px;align-items:center;margin-top:9px"><input id="scheduledTime" type="time" style="flex:1;min-width:0;background:#202126;color:#fff;border:1px solid #393a40;border-radius:10px;padding:10px;font-size:16px"><button class="smallbtn" id="scheduleBtn">預約啟動</button><button class="smallbtn" id="cancelScheduleBtn" style="display:none">取消預約</button></div>
<div class="sub" id="scheduleStatus" style="margin:7px 2px 0"></div>
<div class="footer"><span id="status">待啟動</span><span>警示：15分／1分／10秒</span></div><div class="sub" id="timeAudit" style="margin:6px 2px 0;word-break:break-word"></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">調整計時時間</h2><label>名稱（例如：45分鐘）</label><input id="customName" maxlength="10" placeholder="自訂名稱"><label>時間（小時／分鐘／秒）</label><div style="display:flex;gap:8px"><input id="hours" type="number" min="0" max="99" placeholder="小時"><input id="minutes" type="number" min="0" max="59" placeholder="分鐘"><input id="seconds" type="number" min="0" max="59" placeholder="秒"></div><div class="dialogbuttons"><button class="close" id="closeModal">取消</button><button class="save" id="saveCustom">保存</button></div></div></div>
<script>
const defaults=[["1分鐘",60],["5分鐘",300],["15分鐘",900],["30分鐘",1800],["1小時",3600],["2小時",7200],["3小時",10800],["4小時",14400],["6小時",21600],["8小時",28800],["12小時",43200]];
let timers=defaults.map(([name,duration],i)=>({id:"t"+i,name,duration,remaining:duration,endAt:null,startAt:null,active:false,done:false}));
let edit=false,dragId=null,longPressTimer=null,touchDrag=false;const grid=document.getElementById("grid");
function fmt(s){s=Math.max(0,Math.ceil(s));let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h>0?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function save(){try{localStorage.setItem("compactCountdownLayout",JSON.stringify(timers.map(t=>({id:t.id,name:t.name,duration:t.duration}))))}catch(e){}}
function render(){grid.innerHTML="";document.body.classList.toggle("editing",edit);timers.forEach(t=>{
 const tile=document.createElement("div");tile.className="tile";tile.dataset.id=t.id;tile.draggable=edit;
 let remaining=t.active?Math.max(0,(t.endAt-Date.now())/1000):t.remaining;
 if(t.active&&remaining<=0){t.remaining=0}
 tile.classList.toggle("running",t.active);tile.classList.toggle("done",t.done);
 if(t.active){if(remaining<=10)tile.classList.add("critical");else if(remaining<=60)tile.classList.add("urgent");else if(remaining<=900)tile.classList.add("warning");else if(remaining<=2400)tile.classList.add("greenAlert")}
 tile.innerHTML=`<div class="top"><span class="label">${escapeHTML(t.name)}</span><span class="dot"></span></div><div class="time">${fmt(remaining)}</div><div class="localfinish">${t.active?"結束時間："+new Date(t.endAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}):"本機時間：--:--:--"}</div><div class="actions"><button class="cancel ${t.active?'':'startBtn'}" aria-label="${t.active?'關閉':'啟動'} ${escapeHTML(t.name)}">${t.active?'關閉':'啟動'}</button></div>`;
 tile.querySelector(".cancel").addEventListener("click",e=>{e.stopPropagation();if(t.active){t.active=false;t.done=false;t.remaining=0;t.endAt=null;t.startAt=null}else{const anchor=Date.now();t.remaining=t.duration;t.startAt=anchor;t.endAt=anchor+t.duration*1000;t.active=true;t.done=false}render()});
 tile.addEventListener("click",e=>{if(edit||e.target.closest(".cancel")||tile._touchHandled)return;openEditor(t)});
 tile.addEventListener("dragstart",e=>{dragId=t.id;tile.classList.add("dragging");e.dataTransfer.effectAllowed="move"});
 tile.addEventListener("dragend",()=>{dragId=null;tile.classList.remove("dragging");tile.classList.remove("dragover")});
 tile.addEventListener("dragover",e=>{if(!edit)return;e.preventDefault();tile.classList.add("dragover")});
 tile.addEventListener("dragleave",()=>tile.classList.remove("dragover"));
 tile.addEventListener("drop",e=>{e.preventDefault();tile.classList.remove("dragover");if(!edit||!dragId||dragId===t.id)return;let a=timers.findIndex(x=>x.id===dragId),b=timers.findIndex(x=>x.id===t.id);let [m]=timers.splice(a,1);timers.splice(b,0,m);save();render()});
 tile.addEventListener("touchstart",e=>{if(edit||e.touches.length!==1)return;const touch=e.touches[0];tile._pressOrigin={x:touch.clientX,y:touch.clientY};tile._touchHandled=false;longPressTimer=setTimeout(()=>{touchDrag=true;dragId=t.id;tile.classList.add("dragging");tile.style.transform="scale(.97)";},550)},{passive:true});
 tile.addEventListener("touchmove",e=>{if(longPressTimer&&!touchDrag&&tile._pressOrigin){const touch=e.touches[0];if(Math.abs(touch.clientX-tile._pressOrigin.x)>12||Math.abs(touch.clientY-tile._pressOrigin.y)>12){clearTimeout(longPressTimer);longPressTimer=null}}if(!touchDrag)return;e.preventDefault();const touch=e.touches[0];const target=document.elementFromPoint(touch.clientX,touch.clientY)?.closest(".tile");grid.querySelectorAll(".tile").forEach(x=>x.classList.remove("dragover"));if(target&&target.dataset.id!==dragId)target.classList.add("dragover")},{passive:false});
 tile.addEventListener("touchend",e=>{if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null}if(touchDrag){const touch=e.changedTouches[0];const target=document.elementFromPoint(touch.clientX,touch.clientY)?.closest(".tile");if(target&&target.dataset.id!==dragId){let a=timers.findIndex(x=>x.id===dragId),b=timers.findIndex(x=>x.id===target.dataset.id);if(a>=0&&b>=0){let [m]=timers.splice(a,1);timers.splice(b,0,m);save()}}touchDrag=false;dragId=null;render();return}if(!edit&&!e.target.closest(".cancel")&&tile._pressOrigin){const touch=e.changedTouches[0];if(Math.abs(touch.clientX-tile._pressOrigin.x)<=12&&Math.abs(touch.clientY-tile._pressOrigin.y)<=12){tile._touchHandled=true;openEditor(t);setTimeout(()=>tile._touchHandled=false,700)}}});
 tile.addEventListener("touchcancel",()=>{clearTimeout(longPressTimer);longPressTimer=null;touchDrag=false;dragId=null;render()});
 grid.appendChild(tile);
 });document.getElementById("status").textContent=timers.filter(t=>t.active).length?`运行中 ${timers.filter(t=>t.active).length} 个`:"待启动"}
function updateDisplay(){
  const now=Date.now();
  timers.forEach(t=>{
    const tile=grid.querySelector(`[data-id="${CSS.escape(t.id)}"]`);
    if(!tile)return;
    const remaining=t.active?Math.max(0,(t.endAt-now)/1000):t.remaining;
    const timeEl=tile.querySelector(".time");
    const finishEl=tile.querySelector(".localfinish");
    if(timeEl)timeEl.textContent=fmt(remaining);
    if(finishEl)finishEl.textContent=t.active?"結束時間："+new Date(t.endAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}):"本機時間：--:--:--";
    tile.classList.toggle("running",t.active);
    tile.classList.toggle("done",t.done);
    tile.classList.remove("greenAlert","warning","urgent","critical");
    if(t.active){
      if(remaining<=10)tile.classList.add("critical");
      else if(remaining<=60)tile.classList.add("urgent");
      else if(remaining<=900)tile.classList.add("warning");
      else if(remaining<=2400)tile.classList.add("greenAlert");
    }
    const btn=tile.querySelector(".cancel");
    if(btn){
      btn.textContent=t.active?"關閉":"啟動";
      btn.setAttribute("aria-label",(t.active?"關閉":"啟動")+" "+t.name);
      btn.classList.toggle("startBtn",!t.active);
    }
  });
  document.getElementById("status").textContent=timers.some(t=>t.active)?`運行中 ${timers.filter(t=>t.active).length} 個`:"待啟動";
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function startAll(anchor=Date.now()){timers.forEach(t=>{t.startAt=anchor;t.remaining=t.duration;t.endAt=anchor+t.duration*1000;t.active=true;t.done=false});render()}
document.getElementById("startBtn").addEventListener("click",()=>{scheduledAt=null;showSchedule();startAll()});
document.getElementById("stopAllBtn").addEventListener("click",()=>{scheduledAt=null;showSchedule();timers.forEach(t=>{t.active=false;t.done=false;t.remaining=t.duration;t.endAt=null;t.startAt=null});render()});
let scheduledAt=null;
function showSchedule(){const st=document.getElementById("scheduleStatus"),cancel=document.getElementById("cancelScheduleBtn");if(scheduledAt){st.textContent="已預約："+new Date(scheduledAt).toLocaleString();cancel.style.display="block"}else{st.textContent="";cancel.style.display="none"}}
document.getElementById("scheduleBtn").addEventListener("click",()=>{let val=document.getElementById("scheduledTime").value;if(!val){alert("請先選擇啟動時間");return}let [hh,mm]=val.split(":").map(Number),target=new Date();target.setHours(hh,mm,0,0);if(target.getTime()<=Date.now())target.setDate(target.getDate()+1);scheduledAt=target.getTime();showSchedule()});
document.getElementById("cancelScheduleBtn").addEventListener("click",()=>{scheduledAt=null;showSchedule()});
document.getElementById("resetBtn").addEventListener("click",()=>{if(!confirm("恢復原始11個預設計時器？自訂項目與排序將被清除，所有計時停止。"))return;scheduledAt=null;showSchedule();timers=defaults.map(([name,duration],i)=>({id:"t"+i,name,duration,remaining:duration,endAt:null,startAt:null,active:false,done:false}));edit=false;try{localStorage.removeItem("compactCountdownLayout")}catch(e){}render()});
const modal=document.getElementById("modal");let editingTimerId=null;
function openEditor(t){editingTimerId=t.id;document.getElementById("modalTitle").textContent="調整計時時間";document.getElementById("customName").value=t.name;let total=t.duration;document.getElementById("hours").value=Math.floor(total/3600);document.getElementById("minutes").value=Math.floor((total%3600)/60);document.getElementById("seconds").value=total%60;modal.classList.add("show")}
document.getElementById("addBtn").onclick=()=>{editingTimerId=null;document.getElementById("modalTitle").textContent="新增自訂計時";document.getElementById("customName").value="";document.getElementById("hours").value="";document.getElementById("minutes").value="";document.getElementById("seconds").value="";modal.classList.add("show")};
document.getElementById("closeModal").onclick=()=>modal.classList.remove("show");
document.getElementById("saveCustom").onclick=()=>{let h=Number(document.getElementById("hours").value||0),m=Number(document.getElementById("minutes").value||0),s=Number(document.getElementById("seconds").value||0);let duration=h*3600+m*60+s;if(duration<=0){alert("請輸入大於0的時間");return}let name=document.getElementById("customName").value.trim()||fmt(duration);
if(editingTimerId){let t=timers.find(x=>x.id===editingTimerId);if(t){t.name=name;t.duration=duration;t.remaining=duration;t.active=false;t.done=false;t.endAt=null;t.startAt=null}}
else{timers.push({id:"custom"+Date.now(),name,duration,remaining:duration,endAt:null,startAt:null,active:false,done:false})}
save();render();modal.classList.remove("show");editingTimerId=null};
function updateLiveUI(){
  timers.forEach(t=>{
    const tile=grid.querySelector(`[data-id="${CSS.escape(t.id)}"]`);
    if(!tile)return;
    const remaining=t.active?Math.max(0,(t.endAt-Date.now())/1000):t.remaining;
    const timeEl=tile.querySelector('.time'),finishEl=tile.querySelector('.localfinish');
    if(timeEl)timeEl.textContent=fmt(remaining);
    if(finishEl)finishEl.textContent=t.active?"結束時間："+new Date(t.endAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}):"本機時間：--:--:--";
    tile.classList.toggle('running',t.active);tile.classList.toggle('done',t.done);
    tile.classList.remove('greenAlert','warning','urgent','critical');
    if(t.active){if(remaining<=10)tile.classList.add('critical');else if(remaining<=60)tile.classList.add('urgent');else if(remaining<=900)tile.classList.add('warning');else if(remaining<=2400)tile.classList.add('greenAlert')}
    const btn=tile.querySelector('.cancel');if(btn){btn.textContent=t.active?'關閉':'啟動';btn.classList.toggle('startBtn',!t.active);btn.setAttribute('aria-label',(t.active?'關閉':'啟動')+' '+t.name)}
  });
  document.getElementById('status').textContent=timers.filter(t=>t.active).length?`運行中 ${timers.filter(t=>t.active).length} 個`:'待啟動';
  const active=timers.filter(t=>t.active);const audit=document.getElementById('timeAudit');if(audit){audit.textContent=active.length?`時間校驗｜共同啟動基準：${new Date(Math.min(...active.map(t=>t.startAt||t.endAt-t.duration*1000))).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}｜以實際時間戳計算`:'時間校驗：目前沒有運行中的計時器';}
}
function advanceTimerCycle(t,now){
  if(!t.active||!t.endAt||now<t.endAt)return;
  const cycle=Math.max(1,Number(t.duration))*1000;
  // Keep cycle phase anchored to the prior end timestamp. Never restart from poll time.
  const missed=Math.floor((now-t.endAt)/cycle)+1;
  t.endAt+=missed*cycle;
  t.startAt=t.endAt-cycle;
  t.remaining=t.duration;
  t.done=false;
}
setInterval(()=>{
  const now=Date.now();
  if(scheduledAt&&now>=scheduledAt){const anchor=scheduledAt;scheduledAt=null;showSchedule();startAll(anchor);return}
  timers.forEach(t=>advanceTimerCycle(t,now));
  updateLiveUI();
},250);
try{
 let saved=JSON.parse(localStorage.getItem("compactCountdownLayout")||"null");
 if(saved&&Array.isArray(saved)){
   const normalized=saved.filter(x=>x&&typeof x.name==="string"&&Number.isFinite(Number(x.duration))&&Number(x.duration)>0)
    .map((x,i)=>({id:String(x.id||("saved"+i)),name:x.name,duration:Number(x.duration),remaining:Number(x.duration),endAt:null,active:false,done:false}));
   if(normalized.length)timers=normalized;
 }
}catch(e){}
render();
</script>
</body>
</html>
